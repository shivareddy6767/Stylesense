<!DOCTYPE html>
<html>
<head>
<title>StyleSense AI</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>StyleSense AI 👗</h1>
<p>Upload your photo and see AI outfit suggestions</p>

<div class="container">

<form id="styleForm">

<label>Gender</label>
<select id="gender">
<option>Male</option>
<option>Female</option>
</select>

<label>Occasion</label>
<select id="occasion">
<option>Casual</option>
<option>Party</option>
<option>Office</option>
</select>

<label>Preferred Color</label>
<input type="text" id="color" placeholder="Enter color">

<label>Upload Your Photo</label>
<input type="file" id="image">

<button type="submit">Get AI Outfit</button>

</form>

<div id="result"></div>

</div>

<script src="script.js"></script>

</body>
</html>
